
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5fa">
  <title>Meet The Band Support</title>
  <style>
    :root {
      --primary: #5746a6;
      --background: #f5f5fa;
      --text: #252536;
      --secondary: #686879;
      --surface: #ffffff;
      --border: #e7e6ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 48px 32px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(37, 37, 54, 0.05);
    }

    .logo {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -2px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    p {
      margin: 0 0 20px;
      color: var(--secondary);
    }

    .contact {
      display: inline-block;
      margin: 12px 0 24px;
      padding: 13px 24px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .contact:hover {
      opacity: 0.9;
    }

    footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-size: 13px;
    }

    footer a {
      color: var(--primary);
    }

    @media (max-width: 480px) {
      main {
        padding: 36px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">MTB</div>

    <h1>How can we help?</h1>

    <p>
      Have a question, run into a problem, or want to share
      some feedback about Meet The Band? We'd love to hear from you.
    </p>

    <p>
      Get in touch by email and we'll do our best to help.
    </p>

    <a
      class="contact"
      href="mailto:meetthebandapp@gmail.com"
    >
      Contact Meet The Band Support
    </a>

    <footer>
      <p>Thanks for being part of the MTB community!🫶</p>
    </footer>
  </main>
</body>
</html>
